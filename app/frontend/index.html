<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionnaire de taches</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f6fa; margin: 0; }
  main { max-width: 560px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h1 { color: #1f4e79; margin-top: 0; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 8px; }
  button { padding: 8px 12px; cursor: pointer; }
  li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; }
  .faite { text-decoration: line-through; color: #888; }
  #msg { color: #b00020; }
</style>
</head>
<body>
<main>
  <h1>Gestionnaire de taches</h1>
  <form id="ajout">
    <input type="text" id="titre" placeholder="Nouvelle tache" required>
    <button type="submit">Ajouter</button>
  </form>
  <p id="msg"></p>
  <ul id="liste"></ul>
</main>
<script>
const API = '/api/tasks';
const liste = document.getElementById('liste');
const msg = document.getElementById('msg');

async function charger() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const taches = await r.json();
    msg.textContent = '';
    liste.innerHTML = '';
    for (const t of taches) {
      const li = document.createElement('li');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = t.faite;
      cb.onchange = () => modifier(t.id, { faite: cb.checked });
      const span = document.createElement('span');
      span.textContent = t.titre;
      if (t.faite) span.className = 'faite';
      span.ondblclick = () => {
        const nouveau = prompt('Nouveau titre', t.titre);
        if (nouveau) modifier(t.id, { titre: nouveau });
      };
      const del = document.createElement('button');
      del.textContent = 'Supprimer';
      del.onclick = () => supprimer(t.id);
      li.append(cb, span, del);
      liste.appendChild(li);
    }
  } catch (e) { msg.textContent = 'API injoignable : ' + e.message; }
}

async function modifier(id, data) {
  await fetch(API + '/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  charger();
}
async function supprimer(id) {
  await fetch(API + '/' + id, { method: 'DELETE' });
  charger();
}
document.getElementById('ajout').onsubmit = async (e) => {
  e.preventDefault();
  const champ = document.getElementById('titre');
  await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ titre: champ.value }) });
  champ.value = '';
  charger();
};
charger();
</script>
</body>
</html>
