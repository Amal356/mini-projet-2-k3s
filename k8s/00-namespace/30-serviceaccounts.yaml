# E12 : une identite par composant, sans jeton monte.
# Ces applications n'appellent jamais l'API Kubernetes : inutile de leur donner un jeton.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: taches
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: taches
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-sa
  namespace: taches
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  namespace: taches
automountServiceAccountToken: false
