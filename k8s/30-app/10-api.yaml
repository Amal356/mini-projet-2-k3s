apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: taches
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, tier: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 db 5432; do echo waiting for db; sleep 2; done;']
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
      containers:
      - name: api
        image: tasks-api:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef: { name: app-config }
        env:
        - name: DB_USER
          valueFrom: { secretKeyRef: { name: db-credentials, key: DB_USER } }
        - name: DB_PASSWORD
          valueFrom: { secretKeyRef: { name: db-credentials, key: DB_PASSWORD } }
        readinessProbe:
          httpGet: { path: /ready, port: 3000 }
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: { path: /health, port: 3000 }
          initialDelaySeconds: 15
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
