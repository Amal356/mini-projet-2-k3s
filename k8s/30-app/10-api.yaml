apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: taches
  labels:
    app: taches
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taches
      tier: api
  template:
    metadata:
      labels:
        app: taches
        tier: api
    spec:
      initContainers:
        - name: attendre-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do echo attente de la base; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 64Mi }
      containers:
        - name: api
          image: amal878/taches-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: taches
  labels:
    app: taches
    tier: api
spec:
  selector:
    app: taches
    tier: api
  ports:
    - port: 3000
      targetPort: 3000
