apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: taches
  labels:
    app: taches
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
      }
      location /api/ {
        proxy_pass http://api-svc:3000/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taches
  labels:
    app: taches
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taches
      tier: frontend
  template:
    metadata:
      labels:
        app: taches
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: amal878/taches-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: taches
  labels:
    app: taches
    tier: frontend
spec:
  selector:
    app: taches
    tier: frontend
  ports:
    - port: 80
      targetPort: 8080
