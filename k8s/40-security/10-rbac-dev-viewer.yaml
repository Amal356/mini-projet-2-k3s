# E12 : compte de consultation limite au namespace (moindre privilege)
# Autorise : get/list/watch sur Pods, logs des Pods et Services. Rien d'autre (pas de Secrets).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-viewer
  namespace: taches
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-viewer
  namespace: taches
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-viewer
  namespace: taches
subjects:
  - kind: ServiceAccount
    name: dev-viewer
    namespace: taches
roleRef:
  kind: Role
  name: dev-viewer
  apiGroup: rbac.authorization.k8s.io
