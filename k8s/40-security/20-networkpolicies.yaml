# 1. On bloque TOUT par défaut
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: taches }
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2. On autorise le DNS (sinon rien ne marche)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns, namespace: taches }
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
  - to:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
---
# 3. Traefik -> Frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-frontend-ingress, namespace: taches }
spec:
  podSelector: { matchLabels: { app: frontend } }
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
    ports: [{ protocol: TCP, port: 8080 }]
---
# 4. Frontend -> API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: frontend-to-api, namespace: taches }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: frontend } }
    ports: [{ protocol: TCP, port: 3000 }]
---
# 5. API et Backup -> DB
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-to-db, namespace: taches }
spec:
  podSelector: { matchLabels: { app: db } }
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: api } }
    - podSelector: { matchLabels: { app: db-backup } }
    ports: [{ protocol: TCP, port: 5432 }]
---
# 6. Frontend peut sortir (vers l'API)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: frontend-egress, namespace: taches }
spec:
  podSelector: { matchLabels: { app: frontend } }
  policyTypes: ["Egress"]
  egress:
  - to:
    - podSelector: { matchLabels: { app: api } }
    ports: [{ protocol: TCP, port: 3000 }]
---
# 7. API peut sortir (vers la DB)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-egress, namespace: taches }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: ["Egress"]
  egress:
  - to:
    - podSelector: { matchLabels: { app: db } }
    ports: [{ protocol: TCP, port: 5432 }]
---
# 8. Backup peut sortir (vers la DB)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: backup-egress, namespace: taches }
spec:
  podSelector: { matchLabels: { app: db-backup } }
  policyTypes: ["Egress"]
  egress:
  - to:
    - podSelector: { matchLabels: { app: db } }
    ports: [{ protocol: TCP, port: 5432 }]
