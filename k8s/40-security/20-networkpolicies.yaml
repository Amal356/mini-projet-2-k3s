# E14 : NetworkPolicies - a appliquer EN DERNIER.
# Matrice : Traefik->frontend:8080 OUI | frontend->api:3000 OUI | api->db:5432 OUI
#           backup->db:5432 OUI | frontend->db NON | autre Pod->api,db NON
# Demarche : tout interdire (entrant ET sortant), puis ouvrir flux par flux. DNS autorise.

# 1. Interdire tout le trafic entrant et sortant du namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: taches
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# 2. DNS : tous les Pods peuvent interroger CoreDNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: taches
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 3. Traefik -> frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-frontend
  namespace: taches
spec:
  podSelector:
    matchLabels: { tier: frontend }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: TCP, port: 8080 }
---
# 4. frontend -> api (entrant cote api)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-api
  namespace: taches
spec:
  podSelector:
    matchLabels: { tier: api }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { tier: frontend }
      ports:
        - { protocol: TCP, port: 3000 }
---
# 5. api + sauvegarde -> db (entrant cote db)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-db
  namespace: taches
spec:
  podSelector:
    matchLabels: { tier: db }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { tier: api }
        - podSelector:
            matchLabels: { tier: backup }
      ports:
        - { protocol: TCP, port: 5432 }
---
# 6. Sortant frontend -> api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: taches
spec:
  podSelector:
    matchLabels: { tier: frontend }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: { tier: api }
      ports:
        - { protocol: TCP, port: 3000 }
---
# 7. Sortant api -> db
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-egress
  namespace: taches
spec:
  podSelector:
    matchLabels: { tier: api }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: { tier: db }
      ports:
        - { protocol: TCP, port: 5432 }
---
# 8. Sortant sauvegarde/restauration -> db
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-egress
  namespace: taches
spec:
  podSelector:
    matchLabels: { tier: backup }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels: { tier: db }
      ports:
        - { protocol: TCP, port: 5432 }
